[[permission]]
identifier = "mysql"
description = "Allows the frontend to manage database connections, inspect schema objects, run SQL, and call the analysis model"
commands.allow = [
  "complete_llm",
  "start_llm",
  "poll_llm",
  "list_analysis_history",
  "read_analysis_history",
  "read_llm_catalog",
  "write_llm_catalog",
  "read_locale",
  "write_locale",
  "save_analysis_history",
  "delete_analysis_history",
  "list_connections",
  "upsert_connection",
  "delete_connection",
  "test_connection",
  "connect_session",
  "disconnect_session",
  "list_databases",
  "create_database",
  "drop_database",
  "dump_database",
  "dump_table",
  "write_text_file",
  "write_query_cache",
  "read_query_cache",
  "delete_query_cache",
  "migrate_database",
  "list_charset_catalog",
  "list_tables",
  "list_views",
  "list_indexes",
  "list_triggers",
  "list_routines",
  "get_columns",
  "get_ddl",
  "preview_table",
  "table_row_count",
  "execute_sql"
]
