[package]
name = "app"
version = "1.3.0"
description = "A modular desktop database manager"
authors = ["onesolo.app"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fern = { version = "0.7", features = ["date-based"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2.8"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
mysql_async = { version = "0.36", features = ["native-tls-tls"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
deadpool = "0.12"
native-tls = "0.2"
postgres-native-tls = "0.5"
async-trait = "0.1"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
tiberius = { version = "0.12", features = ["chrono", "rust_decimal", "native-tls"] }
chrono = "0.4"
rust_decimal = "1"
oracle-rs = { path = "vendor/oracle-rs" }
oracle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
csv = "1.4.0"
calamine = "0.38.0"
encoding_rs = "0.8.44"
sha2 = "0.11.1"
hex = "0.4.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
