[package]
name = "app"
version = "1.0.0"
description = "A modular desktop database manager"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
mysql_async = { version = "0.36", features = ["native-tls-tls"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
deadpool = "0.12"
native-tls = "0.2"
postgres-native-tls = "0.5"
async-trait = "0.1"
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
tiberius = { version = "0.12", features = ["chrono", "rust_decimal", "native-tls"] }
chrono = "0.4"
rust_decimal = "1"
oracle-rs = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
