name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: 要打包的平台
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve and validate version
        run: |
          set -eu
          pkg_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)

          if [ "$pkg_version" != "$tauri_version" ] || [ "$pkg_version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: package.json=$pkg_version tauri.conf.json=$tauri_version Cargo.toml=$cargo_version"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            expected="v${pkg_version}"
            if [ "$tag" != "$expected" ]; then
              echo "::error::Tag $tag does not match package version $expected. Bump package.json / tauri.conf.json / Cargo.toml first."
              exit 1
            fi
          fi

          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "Resolved version v${pkg_version}"

      - id: set
        env:
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          set -eu
          case "$PLATFORM" in
            linux)
              include='[{"os":"ubuntu-22.04","rust_targets":"","args":"--bundles deb,appimage"}]'
              ;;
            macos)
              include='[{"os":"macos-latest","rust_targets":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin --bundles dmg"},{"os":"macos-latest","rust_targets":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin --bundles dmg"}]'
              ;;
            windows)
              include='[{"os":"windows-latest","rust_targets":"","args":"--bundles msi"}]'
              ;;
            *)
              include='[{"os":"macos-latest","rust_targets":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin --bundles dmg"},{"os":"macos-latest","rust_targets":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin --bundles dmg"},{"os":"windows-latest","rust_targets":"","args":"--bundles msi"},{"os":"ubuntu-22.04","rust_targets":"","args":"--bundles deb,appimage"}]'
              ;;
          esac
          echo "include=$include" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.90
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            pkg-config \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prefetch bundled Node for build target
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          set -eu
          if [ -n "$RUST_TARGETS" ]; then
            node scripts/fetch-bundled-node.mjs --target "$RUST_TARGETS" --force
          else
            node scripts/fetch-bundled-node.mjs --force
          fi

      - name: Check Apple signing secrets
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: HiDataLinker v__VERSION__
          releaseBody: |
            安装包正在上传。全部平台完成后会补上下载地址。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  notes:
    needs: [select, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write release notes with download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -eu
          version="$VERSION"
          tag="v${version}"
          notes=$(mktemp)

          {
            echo "# HiDataLinker ${version}"
            echo
            echo "本机 MCP / Skill，把正在运行的数据库工作台开放给外部智能体。"
            echo
            echo "## 下载"
            echo
            names=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' || true)
            if [ -z "$names" ]; then
              echo "安装包尚未上传成功，请查看 Actions 日志。"
            else
              echo "$names" | while IFS= read -r name; do
                url="https://github.com/${REPO}/releases/download/${tag}/${name}"
                label="$name"
                case "$name" in
                  *aarch64*.dmg) label="macOS Apple Silicon（.dmg）" ;;
                  *x64*.dmg|*x86_64*.dmg) label="macOS Intel（.dmg）" ;;
                  *.dmg) label="macOS（.dmg）" ;;
                  *.msi) label="Windows（.msi）" ;;
                  *.deb) label="Linux（.deb）" ;;
                  *.AppImage) label="Linux（.AppImage）" ;;
                esac
                echo "- [${label}](${url})"
              done
            fi
            echo
            echo "macOS 安装包已使用 Developer ID 签名并公证。Windows 若被 SmartScreen 拦截，选择仍要运行。Linux 提供 .deb 与 .AppImage。"
            echo
            if [ -f "Features/Feature-${version}.md" ]; then
              echo "## 本版更新"
              echo
              cat "Features/Feature-${version}.md"
            fi
          } > "$notes"

          gh release edit "$tag" --repo "$REPO" --title "HiDataLinker v${version}" --notes-file "$notes"
          echo "Updated https://github.com/${REPO}/releases/tag/${tag}"
